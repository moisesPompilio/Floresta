# SPDX-License-Identifier: MIT OR Apache-2.0

name: Security Functional Tests

on:
  push:
  workflow_dispatch:
  schedule:
    # Sunday, Tuesday, Thursday at 03:17 UTC
    - cron: "17 3 * * 0,2,4"

permissions: {}

jobs:
  security-functional:
    name: Security Functional
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # see more at
      # https://docs.astral.sh/uv/guides/integration/github/
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Prepare environment
        run: uv sync --all-extras --dev

      # Required for compiling the project, as it depends on the bitcoinkernel
      - name: Install Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Prepare functional tests tasks
        env:
          BITCOIN_REVISION: master
        run: |
          tests/prepare.sh --release

      - name: Run security functional tests tasks
        run: |
          tests/run.sh --run-security

      - name: Log tests on failure
        if: failure()
        run: |
          logs=()
          while IFS= read -r line; do
            logs+=("$line")
          done < <(find /tmp/floresta-func-tests* -type f -path "*/logs/*.log" 2>/dev/null || true)

          for logfile in "${logs[@]}"; do
            echo "::group::$logfile"
            cat "$logfile" || echo "Failed to read $logfile"
            echo "::endgroup::"
          done
